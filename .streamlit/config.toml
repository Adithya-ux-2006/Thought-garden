# Streamlit theme for thoughtgarden-src/Thought-garden-main/app_streamlit.py,
# matching the Flask app's Phase 4 "botanical editorial" palette
# (app/static/css/style.css). Streamlit reads this from the directory it is
# launched in - run `streamlit run thoughtgarden-src/Thought-garden-main/app_streamlit.py`
# from the repo root (as .devcontainer and Community Cloud do).

[server]
# Serves thoughtgarden-src/Thought-garden-main/static/ at /app/static/
# (the self-hosted fonts below; no external font CDN).
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#193C32"            # forest
backgroundColor = "#F7F4EC"         # warm ivory
secondaryBackgroundColor = "#EFEBE1"
textColor = "#26332E"               # charcoal
linkColor = "#193C32"
borderColor = "#E2DCCD"
showWidgetBorder = true
baseRadius = "0.5rem"
font = "Inter, sans-serif"
headingFont = "'EB Garamond', serif"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-variable-latin.woff2"
weight = "400 700"

[[theme.fontFaces]]
family = "EB Garamond"
url = "app/static/fonts/eb-garamond-variable-latin.woff2"
weight = "400 600"

[theme.sidebar]
backgroundColor = "#193C32"         # forest, like the Flask navbar
secondaryBackgroundColor = "#24493E"
textColor = "#F7F4EC"
primaryColor = "#D5BFA0"            # sand
linkColor = "#D5BFA0"
borderColor = "#2F5548"
