{% extends "base.html" %}

{% block title %}Not Found - Thought Garden{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="mb-4">
                <i class="bi bi-question-circle display-1 text-muted"></i>
            </div>
            <h1 class="display-5 fw-bold mb-3">404</h1>
            <h2 class="h4 mb-3">Page Not Found</h2>
            <p class="text-muted mb-4">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <a href="{{ url_for('main.dashboard' if current_user.is_authenticated else 'main.index') }}"
               class="btn btn-primary">
                <i class="bi bi-house me-1"></i>Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
