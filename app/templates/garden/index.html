{% extends "base.html" %}

{% block title %}Knowledge Garden - Thought Garden{% endblock %}

{% block content %}
<div class="container-fluid garden-container">
    <div class="row g-0">
        <div class="col-lg-9">
            <div class="garden-header p-3 border-bottom">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="page-eyebrow"><i class="bi bi-diagram-3"></i>Explore</span>
                        <h4 class="mb-0">Knowledge Garden</h4>
                    </div>
                    <div class="d-flex gap-2 align-items-center">
                        <div class="input-group input-group-sm" style="width: 200px;">
                            <input type="text" class="form-control" id="searchNode" placeholder="Find node...">
                            <button class="btn btn-outline-secondary" type="button" onclick="searchNode()">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="physicsToggle" checked>
                            <label class="form-check-label small" for="physicsToggle">Physics</label>
                        </div>
                        <button class="btn btn-sm btn-outline-secondary" onclick="fitGraph()">
                            <i class="bi bi-arrows-fullscreen"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="resetView()">
                            <i class="bi bi-arrow-counterclockwise"></i>
                        </button>
                    </div>
                </div>
                <div class="d-flex gap-3 mt-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="filterPhysics" value="AI">
                        <label class="form-check-label small" for="filterPhysics">
                            <span class="badge bg-primary">AI</span>
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="filterCyber" value="Cybersecurity">
                        <label class="form-check-label small" for="filterCyber">
                            <span class="badge bg-danger">Cyber</span>
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="filterSE" value="Software Engineering">
                        <label class="form-check-label small" for="filterSE">
                            <span class="badge bg-success">SE</span>
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="filterOS" value="Operating Systems">
                        <label class="form-check-label small" for="filterOS">
                            <span class="badge bg-warning">OS</span>
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="filterResearch" value="Research">
                        <label class="form-check-label small" for="filterResearch">
                            <span class="badge bg-info">Research</span>
                        </label>
                    </div>
                </div>
            </div>
            <div id="gardenGraph" class="garden-graph"></div>
        </div>
        
        <div class="col-lg-3">
            <div class="note-panel h-100" id="notePanel">
                <div class="panel-placeholder text-center p-5">
                    <i class="bi bi-diagram-3 display-4 text-muted"></i>
                    <h5 class="mt-3">Click a node to explore</h5>
                    <p class="text-muted">Select any note in the graph to see its details and connections.</p>
                </div>
                
                <div class="panel-content d-none" id="panelContent">
                    <div class="panel-header p-3 border-bottom">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="mb-0" id="panelTitle"></h5>
                            <button class="btn btn-sm btn-link" onclick="closePanel()">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                        <div class="mt-2">
                            <span class="badge bg-primary" id="panelCategory"></span>
                            <span class="badge bg-secondary ms-1" id="panelDate"></span>
                        </div>
                    </div>
                    <div class="panel-body p-3">
                        <div class="mb-3">
                            <h6>Preview</h6>
                            <p class="text-muted small" id="panelPreview"></p>
                        </div>
                        <div class="mb-3">
                            <h6>Tags</h6>
                            <div id="panelTags"></div>
                        </div>
                        <div class="mb-3">
                            <h6>Connections</h6>
                            <div id="panelConnections"></div>
                        </div>
                    </div>
                    <div class="panel-footer p-3 border-top">
                        <a href="#" class="btn btn-primary w-100" id="panelViewBtn">
                            <i class="bi bi-eye me-1"></i>Open Note
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.garden-container {
    height: calc(100vh - 56px);
    overflow: hidden;
}
.garden-container > .row,
.garden-container .col-lg-9,
.garden-container .col-lg-3 {
    height: 100%;
}
.garden-container .col-lg-9 {
    display: flex;
    flex-direction: column;
}
.garden-graph {
    flex: 1 1 auto;
    height: auto;
    min-height: 0;
}
.note-panel {
    background: var(--bg-card, #fff);
    border-left: 1px solid var(--border-color, #dee2e6);
    height: 100%;
    overflow-y: auto;
}
.panel-placeholder, .panel-content {
    height: 100%;
}
#panelConnections .connection-item {
    padding: 0.5rem;
    border-radius: 0.375rem;
    background: var(--bg-secondary, #f8f9fa);
    margin-bottom: 0.5rem;
}
#panelConnections .connection-item:hover {
    background: var(--border-color, #e9ecef);
}
@media (max-width: 768px) {
    .garden-container {
        height: auto;
        overflow: visible;
    }
    .garden-container > .row,
    .garden-container .col-lg-9,
    .garden-container .col-lg-3 {
        height: auto;
    }
    .garden-graph {
        flex: none;
        height: 60vh;
        min-height: 400px;
    }
}
</style>

{% endblock %}
