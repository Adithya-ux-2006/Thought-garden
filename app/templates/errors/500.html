{% extends "base.html" %}

{% block title %}Server Error - Thought Garden{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="empty-state-art mx-auto" aria-hidden="true">
                <img src="{{ url_for('static', filename='img/garden/sprout.svg') }}" alt="" width="64" height="64">
            </div>
            <p class="page-eyebrow justify-content-center">Error 500</p>
            <h1 class="mb-3">Something Went Wrong</h1>
            <p class="text-muted mb-4">
                An unexpected error occurred. Our team has been notified.
                Please try again in a moment.
            </p>
            <a href="/" class="btn btn-primary">
                <i class="bi bi-house me-1" aria-hidden="true"></i>Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
