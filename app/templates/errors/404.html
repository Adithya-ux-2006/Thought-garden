{% extends "base.html" %}

{% block title %}Not Found - Thought Garden{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="empty-state-art mx-auto" aria-hidden="true">
                <img src="{{ url_for('static', filename='img/garden/seed.svg') }}" alt="" width="64" height="64">
            </div>
            <p class="page-eyebrow justify-content-center">Error 404</p>
            <h1 class="mb-3">Page Not Found</h1>
            <p class="text-muted mb-4">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <a href="{{ url_for('main.dashboard' if current_user.is_authenticated else 'main.index') }}"
               class="btn btn-primary">
                <i class="bi bi-house me-1" aria-hidden="true"></i>Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
